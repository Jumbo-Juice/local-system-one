# Lenovo alternative: more accurate on navigation/targets, ~2x slower, near the 8 GB XPU limit.
# Qwen2.5-3B-Instruct uses the Qwen Research licence (non-commercial), unlike the Apache-2.0 1.5B.
[backend]
kind = "hf"
model = "Qwen/Qwen2.5-3B-Instruct"
device = "auto"
dtype = "bfloat16"
max_batch = 8          # batch 32 ran out of XPU memory (Observed)
head_dtype = "model"   # bf16 head: a float32 copy (+1.2 GB) would leave ~0.5 GB for activations (not tested).
prefix_cache = true     # reuse keys/values of repeated prompt prefixes (~9% faster moves, Observed)

[engine]
answer = "label"
answer_template = '{"choice": "<label>"}'
prompt_order = "state_first"  # question/options first reuse more but cost accuracy (docs/research.md)

[shooter]
order_debias = false  # demo.shooter: the 3B escaped 14 of 20 seeds without it, 8 of 20 with it (docs/research.md)
